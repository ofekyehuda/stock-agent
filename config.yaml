# ════════════════════════════════════════════════════
#   Stock Alert Agent — קובץ הגדרות
# ════════════════════════════════════════════════════

# ── טלגרם ────────────────────────────────────────────
telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"   # קבל מ-@BotFather
  chat_id: "YOUR_CHAT_ID_HERE"       # קבל מ-@userinfobot

# ── תדירות סריקה (בדקות) ─────────────────────────────
interval_minutes: 5

# ════════════════════════════════════════════════════
#   מניות וקריטריונים
#   כל rule הוא אופציונלי — מחק אם לא רלוונטי
# ════════════════════════════════════════════════════
stocks:

  - symbol: NVDA
    rules:
      # שינוי % ממחיר פתיחה (חיובי = עליה, שלילי = ירידה)
      price_change_pct: 2.0        # התראה אם עלה/ירד 2% ממחיר פתיחה

      # מחירי יעד
      price_targets:
        - price: 210.00
          direction: above         # above = מעל | below = מתחת
        - price: 185.00
          direction: below

      # RSI
      rsi:
        period: 14
        oversold: 30               # RSI מתחת ל-30 = קניה יתרה
        overbought: 70             # RSI מעל 70 = מכירה יתרה

      # נפח חריג
      volume_spike:
        multiplier: 3.0            # נפח גבוה פי 3 מהממוצע
        lookback: 20               # ממוצע על 20 נרות אחרונים

