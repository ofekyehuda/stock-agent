# ── טלגרם ────────────────────────────────────────────
telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"

# ── תדירות סריקה (בדקות) ─────────────────────────────
interval_minutes: 5

# ════════════════════════════════════════════════════
stocks:

  - symbol: NVDA
    rules:
      price_change_pct: 2.0
      price_targets:
        - price: 210.00
          direction: above
        - price: 185.00
          direction: below
      rsi:
        period: 14
        oversold: 30
        overbought: 70
      volume_spike:
        multiplier: 3.0
        lookback: 20

